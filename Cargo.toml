[package]
name = "mediatime"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/findit-studio/mediatime"
homepage = "https://github.com/findit-studio/mediatime"
documentation = "https://docs.rs/mediatime"
description = "Exact-integer rational time types for media pipelines — FFmpeg-style Timebase, Timestamp, and TimeRange. no_std, zero dependencies, const fn."
license = "MIT OR Apache-2.0"
rust-version = "1.85"
keywords = ["media", "timebase", "timestamp", "pts", "ffmpeg"]
categories = ["multimedia", "multimedia::video", "date-and-time", "no-std", "no-std::no-alloc"]

[[bench]]
path = "benches/gcd.rs"
name = "gcd"
harness = false

[features]
default = ["std"]
std = ["serde?/default"]

serde = ["dep:serde"]
arbitrary = ["dep:arbitrary"]
# Native `quickcheck::Arbitrary` for `Timebase`, `Timestamp`, `TimeRange` via
# the `quickcheck-richderive` derive — each type carries
# `#[cfg_attr(feature = "quickcheck", derive(::quickcheck_richderive::Arbitrary),
# quickcheck(arbitrary = "…"))]` and a `fn(&mut Gen) -> Self` helper preserves
# the invariants (non-zero denom, non-negative pts, well-formed range).
quickcheck = ["dep:quickcheck", "dep:quickcheck-richderive"]
buffa = ["dep:buffa"]


[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }
arbitrary = { version = "1", optional = true, default-features = false }
quickcheck = { version = "1", optional = true, default-features = false }
# `quickcheck-richderive` is the proc-macro that emits native
# `impl quickcheck::Arbitrary` blocks; the container-level `arbitrary = "…"`
# attribute routes generation through the `quickcheck_impls::*` helpers so
# invariants stay sound. Not `with = "…"`: since the derive's 0.2.0 that names
# a *module* supplying both `arbitrary` and `shrink`, and the helpers here are
# plain functions.
quickcheck-richderive = { version = "0.4", optional = true }
buffa = { version = "0.9", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8"
quickcheck = "1"
arbitrary = "1"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
